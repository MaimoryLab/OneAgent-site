name: Deploy

# Publishes the site to GitHub Pages. Separate from CI so a deploy cannot happen
# without the three gates in ci.yml having passed on the same commit.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Manual runs are allowed so a Pages configuration change can be published
  # without an empty commit.
  workflow_dispatch:
  # Twice a day, to refresh what the build reads from GitHub rather than from the
  # repository: the header's star count and the download page's release assets.
  # Both are fetched at build time because the site's CSP is `default-src 'self'`
  # with no connect-src exception, so a browser-side call to api.github.com is
  # blocked — which means those numbers are only ever as fresh as the last deploy.
  # Without this they sat at whatever they were when someone last merged; the star
  # count was showing 3 against an actual 13.
  #
  # 07:41/19:41 UTC rather than on the hour: scheduled workflows all queue against
  # GitHub's shared runner pool, and the top of the hour is the worst time to ask.
  schedule:
    - cron: "41 7,19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is cancelled rather than queued: the newest commit on main
# is the one that should be live, and two deploys racing would decide by finish
# order instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Publishing Pages from a private repository needs a paid plan, and this
  # repository is private on a free org. Without this gate the deploy job below
  # would fail at actions/configure-pages after every green CI run on main,
  # leaving the default branch permanently red — which teaches everyone to stop
  # reading the badge, the same way the rate-limit failures in #3 did.
  #
  # So the availability of Pages is a precondition to check, not an error to hit.
  # When it becomes available (the repository goes public, or the plan changes)
  # this passes on its own with no edit here. See issue #4.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      pages_available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 404 means Pages is not configured, which is not the same as not
          # allowed — so ask whether it *can* be enabled by reading the
          # repository's own capability flag rather than its current state.
          if gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages' | grep -qx true; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Pages is configured for this repository."
          elif [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')" = "public" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Repository is public, so Pages can be enabled by the deploy step."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Pages is unavailable: this repository is private and the plan does not permit Pages from private repositories. See issue #4."
          fi

  deploy:
    needs: preflight
    # workflow_run fires on failure too, so the conclusion has to be checked
    # explicitly — without this, a red CI run would still publish.
    #
    # schedule and workflow_dispatch carry no workflow_run payload, so they are
    # named rather than falling through to that check: a `github.event.workflow_run`
    # that does not exist is null, the comparison fails, and the job silently skips.
    # That is precisely how a scheduled deploy would look like it ran while
    # publishing nothing.
    if: |
      needs.preflight.outputs.pages_available == 'true'
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'schedule'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch by default, not the commit
          # that was tested. Pin it so the artifact matches what CI verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Reports the site's real origin and path, so SITE_URL and BASE_PATH are
      # not hardcoded here. Left unset, astro.config.mjs falls back to
      # http://localhost:4321 and the sitemap advertises loopback to crawlers.
      - uses: actions/configure-pages@v6
        id: pages

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
