name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test

      # Runs astro check and validate-build.mjs, so a type error or a malformed
      # page fails here rather than reaching the deploy workflow.
      #
      # GITHUB_TOKEN raises the Releases API budget from the 60/hour that every
      # unauthenticated caller sharing this runner's IP competes for, to 1000/hour
      # for this repository. The build tolerates a refusal either way, but it
      # renders an empty download page when it happens, which is not what a
      # release build should publish.
      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
